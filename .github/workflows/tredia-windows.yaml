name: Tredia Studio (Windows)
run-name: ${{ github.ref_name }} — Windows build

# Builds Tredia Studio for Windows x64 on every push to the tredia branch (zip + installer as a build
# artifact), and publishes a GitHub release for tags named tredia-v* (e.g. tredia-v1.0.0).
on:
  push:
    branches:
      - tredia
    tags:
      - 'tredia-v*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tredia-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch the brand font (IBM Plex Sans Arabic, SIL Open Font License 1.1)
        run: |
          $Fonts = Join-Path "${{ github.workspace }}" "frontend/data/fonts"
          New-Item -ItemType Directory -Force -Path $Fonts | Out-Null
          $Base = "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic"
          foreach ($File in @("IBMPlexSansArabic-Regular.ttf", "IBMPlexSansArabic-Medium.ttf", "IBMPlexSansArabic-SemiBold.ttf", "IBMPlexSansArabic-Bold.ttf", "OFL.txt")) {
            Invoke-WebRequest -Uri "$Base/$File" -OutFile (Join-Path $Fonts $File)
          }
          Get-ChildItem $Fonts | Format-Table Name, Length

      - name: Build Tredia Studio
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      # The montage editor renders on the PC with ffmpeg (a separate program the plugin runs). Pinned to
      # gyan.dev's FFmpeg 9.0.2 "essentials" build (GPLv3, the Windows builds ffmpeg.org links to), checked
      # against the release's SHA-256 before it goes in the package with its license.
      - name: Add ffmpeg for the montage export
        run: |
          $Url = "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.7z"
          $Sha = "4705843ccaaf54257c16ad90f3e952ece33c17df964ecf7bfdbb0f49c7171077"
          $Archive = Join-Path $env:RUNNER_TEMP "ffmpeg.7z"
          Invoke-WebRequest -Uri $Url -OutFile $Archive
          $Got = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLower()
          if ($Got -ne $Sha) { throw "ffmpeg archive checksum mismatch: $Got" }
          $Out = Join-Path $env:RUNNER_TEMP "ffmpeg"
          7z x $Archive "-o$Out" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          $Exe = Get-ChildItem -Path $Out -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $License = Get-ChildItem -Path $Out -Recurse -Filter LICENSE | Select-Object -First 1
          if (-not $Exe) { throw "ffmpeg.exe not in the archive" }
          $Bin = Join-Path "${{ github.workspace }}" "build_x64/install/bin/64bit"
          # Next to the program itself (tredia-studio.exe): the plugin looks for it there.
          if (-not (Test-Path (Join-Path $Bin "tredia-studio.exe"))) { throw "tredia-studio.exe not found in $Bin" }
          Copy-Item $Exe.FullName (Join-Path $Bin "tredia-ffmpeg.exe")
          if ($License) { Copy-Item $License.FullName (Join-Path $Bin "tredia-ffmpeg-LICENSE.txt") }
          & (Join-Path $Bin "tredia-ffmpeg.exe") -hide_banner -version | Select-Object -First 1

      - name: Package Tredia Studio
        run: |
          $Install = Join-Path "${{ github.workspace }}" "build_x64/install"
          $IsTag = "${{ github.ref_type }}" -eq "tag"
          $Version = if ($IsTag) { "${{ github.ref_name }}".Replace("tredia-v", "") } else { "dev-" + "${{ github.sha }}".Substring(0, 9) }
          $Name = "Tredia-Studio-${Version}-windows-x64"
          $Dist = Join-Path "${{ github.workspace }}" "dist"
          New-Item -ItemType Directory -Force -Path $Dist | Out-Null

          # Portable zip
          Compress-Archive -Path (Join-Path $Install "*") -DestinationPath (Join-Path $Dist "${Name}.zip")

          # Installer (NSIS, installed on the runner if missing)
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress | Out-Null
            $env:PATH += ";" + (Join-Path ${env:ProgramFiles(x86)} "NSIS")
          }
          $NsisVersion = if ($IsTag) { $Version } else { "0.0.0" }
          $Setup = Join-Path $Dist "${Name}-setup.exe"
          makensis /V2 "/DVERSION=$NsisVersion" "/DSRCDIR=$Install" "/DOUTFILE=$Setup" "/DROOT=${{ github.workspace }}" installer/tredia-studio.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tredia-studio-windows-x64-${{ github.sha }}
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Files = Get-ChildItem dist/* | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @Files `
            --title "Tredia Studio ${{ github.ref_name }}" `
            --notes "Tredia Studio for Windows (x64). Built on OBS Studio 33.0.1 (GPL-2.0-or-later). Source code: this repository."
